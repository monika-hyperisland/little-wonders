
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Wonder | Little Wonders</title>
</head>
<body>
  <main class="container py-5">
    <h1 class="mb-3">Edit Wonder</h1>
    <p class="text-muted">
      Update a little moment worth remembering.
    </p>

    <form id="editWonderForm">
      <div class="mb-3">
        <label for="category" class="form-label">Category</label>
        <select id="category" class="form-select" required>
          <option value="">Choose a category</option>
          <option value="pet">Pet</option>
          <option value="plant">Plant</option>
          <option value="adventure">Adventure</option>
          <option value="creation">Creation</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input
          type="text"
          id="title"
          class="form-control"
          maxlength="150"
          required
        />
      </div>

      <div class="mb-4">
        <label for="description" class="form-label">Description</label>
        <textarea
          id="description"
          class="form-control"
          rows="4"
        ></textarea>
      </div>

      <button type="submit" class="btn btn-primary">
        Save Changes
      </button>

      <a href="wonders.html" class="btn btn-outline-secondary ms-2">
        Cancel
      </a>
    </form>

    <div id="editWonderMessage" role="status" aria-live="polite"></div>
  </main>

  <script type="module" src="/src/pages/edit-wonder.js"></script>
</body>
</html>
