
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Login | Little Wonders</title>
 <link rel="icon" type="image/svg+xml" href="/vite.svg" />

</head>

<body>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">

        <div class="wonder-card p-4 p-md-5">

          <div class="text-center mb-4">
            <i class="bi bi-flower1 fs-1 text-wonder"></i>

            <h1 class="h2 mt-3">
              Welcome Back
            </h1>

            <p class="text-muted">
              Your little wonders are waiting for you.
            </p>
          </div>

          <form id="loginForm">

            <div class="mb-3">
              <label for="email" class="form-label">
                Email Address
              </label>

              <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                autocomplete="email"
                required
              />
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">
                Password
              </label>

              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                autocomplete="current-password"
                required
              />
            </div>

            <button
              type="submit"
              class="btn btn-wonder w-100"
            >
              Login
            </button>

          </form>

        <div
        id="loginMessage"
        role="status"
        aria-live="polite"
        ></div>

        
<div id="logoutSection" class="mt-3 d-none">
  <button
    type="button"
    id="logoutButton"
    class="btn w-100 rounded-pill fw-semibold"
    style="height: 40px; background-color: white; color: #849f7b; border: 1px solid #849f7b;"
  >
    Log out
  </button>
</div>


          <p class="text-center mt-4 mb-0">
            Don't have an account?
            <a href="register.html">Create Account</a>
          </p>

        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/src/pages/login.js"></script>

</body>
</html>
