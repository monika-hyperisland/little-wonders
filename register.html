
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Register | Little Wonders</title>
</head>

<body>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">

        <div class="wonder-card p-4 p-md-5">

          <div class="text-center mb-4">
            <i class="bi bi-flower1 fs-1 text-wonder"></i>

            <h1 class="h2 mt-3">
              Create Your Account
            </h1>

            <p class="text-muted">
              Start collecting your little wonders.
            </p>
          </div>

          <form id="registerForm">

            <div class="mb-3">
              <label for="fullName" class="form-label">
                Your Name
              </label>

              <input
                type="text"
                id="fullName"
                name="fullName"
                class="form-control"
                autocomplete="name"
                required
              />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">
                Email Address
              </label>

              <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                autocomplete="email"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">
                Password
              </label>

              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>

            <div class="mb-4">
              <label for="confirmPassword" class="form-label">
                Confirm Password
              </label>

              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                class="form-control"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>

            <button
              type="submit"
              class="btn btn-wonder w-100"
            >
              Create Account
            </button>

          </form>
          
        <div
        id="registerMessage"
        role="status"
        aria-live="polite"
        ></div>


          <p class="text-center mt-4 mb-0">
            Already have an account?
            <a href="login.html">Login</a>
          </p>

        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/src/pages/register.js"></script>

</body>
</html>
